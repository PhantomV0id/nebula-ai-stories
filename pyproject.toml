[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-ai-stories"
version = "0.1.0"
description = "Local-first story ideation, scoring, novelty filtering, and shot planning for short AI micro-stories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nebula-ai-stories = "nebula_ai_stories.ui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["nebula_ai_stories*"]
